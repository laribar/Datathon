services:
  - type: web
    name: neohr-ml-service
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2
    rootDir: .
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: https://interview-nexus-go.lovable.app,https://*.lovable.app
      - key: API_KEY
        sync: false
    plan: free
    autoDeploy: true