services:
  - type: web
    name: neohr-ml-service
    runtime: python
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://interview-nexus-go.lovable.app,https://*.lovable.app
      - key: API_KEY
        sync: false
      - key: MODEL_PATH
        value: models/model.joblib
      - key: MODEL_URL
        value: ""
    plan: free
    autoDeploy: true
